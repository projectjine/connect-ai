<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고립된 뇌가 느끼는 통증의 실체 | Danhae Insight</title>
    
    <!-- 1. 타이포그래피 (Playfair Display & Noto Sans KR & Arimo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;500;600;700;1,400;1,500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* =====================================================================
           [Core Design Tokens & Global Styles]
           ===================================================================== */
        :root {
            --color-surface: #F4F7F4;       /* Atmospheric Background */
            --color-on-surface: #2C332C;    /* Main Text */
            --color-heading: #1A241E;       /* Deep Heading */
            --color-brand-sage: #4A654E;    /* Primary Accent */
            --color-brand-sage-deep: #2F3E33;
            --color-glass: rgba(255, 255, 255, 0.4);
            --color-glass-border: rgba(255, 255, 255, 0.6);
            --color-divider: rgba(44, 51, 44, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--color-surface);
            color: var(--color-on-surface);
            font-family: 'Arimo', 'Noto Sans KR', sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Playfair Display', 'Noto Sans KR', serif;
            color: var(--color-heading);
            font-weight: 600;
        }

        /* =====================================================================
           [Header Navigation (Glassmorphism)]
           ===================================================================== */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 70px;
            background: rgba(244, 247, 244, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--color-divider);
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 2rem;
        }

        .header-logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            color: var(--color-heading);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .header-logo:hover {
            color: var(--color-brand-sage);
        }

        /* =====================================================================
           [Main Layout (Max Width 768px)]
           ===================================================================== */
        main {
            max-width: 768px; /* 48rem */
            margin: 0 auto;
            padding: 120px 1.5rem 60px 1.5rem; /* 헤더 공간 + 본문 여백 */
        }

        /* =====================================================================
           [Hero Section: Title, Meta, Featured Image]
           ===================================================================== */
        .insight-header {
            margin-bottom: 3rem;
            text-align: center;
        }

        .insight-category {
            color: var(--color-brand-sage);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            margin-bottom: 1rem;
            display: block;
        }

        .insight-title {
            font-size: 2.5rem;
            line-height: 1.3;
            margin-bottom: 1.5rem;
            word-break: keep-all;
        }

        .insight-meta {
            font-size: 0.875rem;
            color: rgba(44, 51, 44, 0.6);
            letter-spacing: 0.05em;
        }

        .insight-featured-image {
            width: 100%;
            height: auto;
            border-radius: 1rem;
            margin-bottom: 3rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        /* =====================================================================
           [Article Body (Typography & Spacing)]
           ===================================================================== */
        .insight-body p {
            font-size: 1.125rem;
            line-height: 1.9;
            margin-bottom: 2rem;
            word-break: keep-all;
        }

        .insight-body h2 {
            font-size: 1.75rem;
            margin-top: 3rem;
            margin-bottom: 1.5rem;
        }

        .insight-body img {
            width: 100%;
            border-radius: 0.5rem;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .insight-body figcaption {
            text-align: center;
            font-size: 0.875rem;
            color: rgba(44, 51, 44, 0.6);
            font-style: italic;
            margin-bottom: 2rem;
        }

        /* =====================================================================
           [Key Takeaway (Danhae's Reflection)]
           ===================================================================== */
        .key-takeaway {
            border-left: 3px solid var(--color-brand-sage);
            background: var(--color-glass);
            padding: 2rem;
            border-radius: 0.5rem;
            margin: 3rem 0;
            font-family: 'Playfair Display', 'Noto Sans KR', serif;
        }

        .key-takeaway-title {
            font-size: 1.25rem;
            color: var(--color-brand-sage);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .key-takeaway p {
            font-style: italic;
            margin-bottom: 0;
            color: rgba(44, 51, 44, 0.9);
            font-size: 1.2rem;
            line-height: 1.8;
        }

        hr {
            border: 0;
            border-top: 1px solid var(--color-divider);
            margin: 4rem 0;
        }

        /* =====================================================================
           [Related Insights (Cards)]
           ===================================================================== */
        .related-insights-section {
            margin-top: 4rem;
        }

        .related-title {
            font-size: 1.5rem;
            margin-bottom: 2rem;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .insight-card {
            background: var(--color-glass);
            border: 1px solid var(--color-glass-border);
            border-radius: 1.5rem;
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .insight-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            background: rgba(255,255,255,0.7);
        }

        .card-date {
            font-size: 0.75rem;
            color: rgba(44, 51, 44, 0.6);
            margin-bottom: 0.5rem;
        }

        .card-title {
            font-size: 1.125rem;
            line-height: 1.5;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .card-action {
            color: var(--color-brand-sage);
            font-size: 0.875rem;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .insight-title { font-size: 2rem; }
            .insight-body p { font-size: 1.05rem; }
            .related-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- 헤더 내비게이션 -->
    <header>
        <a href="/" class="header-logo">Danhae Philosophy</a>
    </header>

    <!-- 메인 상세 페이지 렌더링 컨테이너 -->
    <main id="insight-container">
        <!-- 초기 로딩 스켈레톤 (선택사항) -->
        <div style="text-align: center; padding: 5rem 0; opacity: 0.5;">
            데이터를 불러오는 중입니다...
        </div>
    </main>

    <!-- JS: 기능 구현 (WordPress REST API 또는 JSON 데이터 동기화) -->
    <script>
        /**
         * [웹 마스터] 기능 구현 스크립트
         * URL 파라미터(예: ?id=123)를 통해 WP 포스트 ID를 인식하고,
         * 워드프레스 REST API를 호출하여 화면을 동적으로 렌더링합니다.
         */
        const WP_API_URL = 'https://insights.sociallogiclab.org/wp-json/wp/v2/posts';
        const container = document.getElementById('insight-container');

        // 1. URL에서 파라미터 파싱
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        // 2. 임시 하드코딩 데이터 (API 연동 전 테스트용)
        const mockData = {
            title: "고립된 뇌가 느끼는 통증의 실체",
            category: "PSYCHOLOGY",
            date: "2026. 05. 15",
            author: "Danhae",
            featuredImage: "https://images.unsplash.com/photo-1518020382113-a7e8fc38eac9?auto=format&fit=crop&q=80&w=1200",
            content: `
                <p>우리의 뇌는 혼자 남겨지는 것을 물리적 상처만큼이나 고통스럽게 인식합니다. 최근 신경과학 연구에 따르면, 사회적 고립 시 활성화되는 뇌의 영역은 뼈가 부러질 때 반응하는 통증 네트워크와 정확히 일치합니다.</p>
                
                <h2>연결되지 않은 자아의 위기</h2>
                <p>디지털이 모든 것을 연결하는 시대라지만, 역설적으로 우리는 가장 고립되어 있습니다. 스크린 너머의 무수한 '좋아요'는 도파민을 분비시킬 뿐, 옥시토신을 생성하는 진짜 연결을 대체하지 못합니다.</p>
                
                <div class="key-takeaway">
                    <div class="key-takeaway-title">Key Takeaway</div>
                    <p>"혼자임을 선택한 고독은 우리를 단단하게 만들지만, 강요된 고립은 우리의 신경망을 파괴한다. 진정한 연결은 스크린을 끄고 상대방의 눈동자에 나의 시선을 온전히 머물게 할 때 시작된다."</p>
                </div>
            `,
            related: [
                { id: 101, title: "도파민 중독에서 벗어나는 3가지 앵커링 기법", date: "2026. 05. 10" },
                { id: 102, title: "완벽주의라는 이름의 교묘한 자기 파괴", date: "2026. 05. 05" }
            ]
        };

        // 3. 렌더링 함수
        function renderInsight(data) {
            // 본문 렌더링
            let html = `
                <article class="insight-article">
                    <header class="insight-header">
                        <span class="insight-category">${data.category}</span>
                        <h1 class="insight-title">${data.title}</h1>
                        <div class="insight-meta">
                            By ${data.author} · ${data.date}
                        </div>
                    </header>
                    
                    ${data.featuredImage ? `<img src="${data.featuredImage}" alt="${data.title}" class="insight-featured-image">` : ''}
                    
                    <div class="insight-body">
                        ${data.content}
                    </div>
                </article>
                <hr>
            `;

            // 관련 글 렌더링
            if (data.related && data.related.length > 0) {
                html += `
                    <section class="related-insights-section">
                        <h3 class="related-title">관련된 다른 통찰 읽기</h3>
                        <div class="related-grid">
                            ${data.related.map(item => `
                                <a href="?id=${item.id}" class="insight-card">
                                    <span class="card-date">${item.date}</span>
                                    <h4 class="card-title">${item.title}</h4>
                                    <span class="card-action">Read More &rarr;</span>
                                </a>
                            `).join('')}
                        </div>
                    </section>
                `;
            }

            container.innerHTML = html;
        }

        // 4. 실행 로직 (실제 워드프레스 연동 시 API 통신으로 대체)
        async function loadContent() {
            try {
                if (postId) {
                    // 실제 WP API 호출 예시 (현재 주석 처리)
                    /*
                    const response = await fetch(\`\${WP_API_URL}/\${postId}?_embed\`);
                    const post = await response.json();
                    renderInsight({
                        title: post.title.rendered,
                        category: "INSIGHT", // 카테고리 로직 필요
                        date: new Date(post.date).toLocaleDateString('ko-KR'),
                        author: "Danhae",
                        featuredImage: post._embedded?.['wp:featuredmedia']?.[0]?.source_url || '',
                        content: post.content.rendered,
                        related: [] // 관련 글 로직 필요
                    });
                    */
                    
                    // 테스트: 파라미터가 있어도 임시 데이터 렌더링
                    renderInsight(mockData);
                } else {
                    // ID가 없을 경우 기본 데이터 렌더링 (또는 에러 처리)
                    renderInsight(mockData);
                }
            } catch (error) {
                container.innerHTML = \`<div style="text-align:center; color:red; padding: 5rem 0;">데이터를 불러오는 데 실패했습니다.</div>\`;
                console.error("Fetch error: ", error);
            }
        }

        // 스크립트 시작점
        document.addEventListener('DOMContentLoaded', loadContent);
    </script>
</body>
</html>
