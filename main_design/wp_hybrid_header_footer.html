<!-- 
========================================================
[WebMaster] 하이브리드 통합 엔진 (Hybrid Master Code)
목적: 워드프레스의 헤더/푸터를 메인 사이트(Danhae) 디자인으로 100% 하드코딩 교체
사용법: Elementor의 'Custom HTML(사용자 정의 HTML)' 블록 또는 Header/Footer Builder에 
아래 전체 코드를 복사해서 붙여넣으십시오.
======================================================== 
-->

<style>
/* ==================== 1. 절대 시스템 고정 (Reset) ==================== */
.hybrid-master-header, .hybrid-master-footer {
  font-family: 'Arimo', 'Noto Sans KR', sans-serif !important;
  box-sizing: border-box !important;
  --header-bg: rgba(247, 250, 249, 0.85); /* 민트 화이트 글래스모피즘 */
  --header-border: rgba(74, 101, 78, 0.1);
  --brand-sage: #4A654E;
  --brand-sage-hover: #2F3E33;
  --brand-mint: #F7FAF9;
  --brand-dark: #2C332C;
}
.hybrid-master-header *, .hybrid-master-footer * { 
  box-sizing: border-box !important; 
}

/* ==================== 2. HEADER (Navigation) 100% 복제 ==================== */
.hybrid-master-header {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  background: var(--header-bg) !important;
  backdrop-filter: blur(15px) !important;
  -webkit-backdrop-filter: blur(15px) !important;
  border-bottom: 1px solid var(--header-border) !important;
  z-index: 999999 !important; /* 최상단 강제 고정 */
  height: 80px !important;
  display: flex !important;
  align-items: center !important;
  transition: all 0.3s ease !important;
}

.hybrid-header-container {
  max-width: 1200px !important;
  width: 100% !important;
  margin: 0 auto !important;
  padding: 0 2rem !important;
  display: flex !important;
  justify-content: space-between !important;
  align-items: center !important;
}

/* 로고 (Playfair Display) */
.hybrid-logo a {
  font-family: 'Playfair Display', serif !important;
  font-size: 1.7rem !important;
  font-weight: 700 !important;
  color: var(--brand-sage) !important;
  text-decoration: none !important;
  letter-spacing: -0.02em !important;
}

/* 하드코딩 네비게이션 메뉴 */
.hybrid-nav ul {
  list-style: none !important;
  display: flex !important;
  gap: 3rem !important;
  margin: 0 !important;
  padding: 0 !important;
}

.hybrid-nav a {
  text-decoration: none !important;
  color: var(--brand-dark) !important;
  font-size: 0.9rem !important;
  font-weight: 700 !important;
  text-transform: uppercase !important;
  letter-spacing: 0.1em !important;
  transition: color 0.3s ease, transform 0.3s ease !important;
}

/* 호버 시 Sage Green 으로 변환 */
.hybrid-nav a:hover {
  color: var(--brand-sage) !important;
}

/* CTA 버튼 (우측) */
.hybrid-btn {
  background-color: var(--brand-sage) !important;
  color: #fff !important;
  padding: 0.6rem 1.8rem !important;
  border-radius: 24px !important; /* 곡률 통일 */
  text-decoration: none !important;
  font-weight: 700 !important;
  font-size: 0.85rem !important;
  text-transform: uppercase !important;
  letter-spacing: 0.1em !important;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
  box-shadow: 0 4px 15px rgba(74, 101, 78, 0.1) !important;
}

.hybrid-btn:hover {
  background-color: var(--brand-sage-hover) !important;
  transform: translateY(-2px) !important;
  box-shadow: 0 8px 20px rgba(74, 101, 78, 0.25) !important;
}

/* ==================== 3. FOOTER 100% 복제 ==================== */
.hybrid-master-footer {
  background-color: var(--brand-dark) !important;
  color: var(--brand-mint) !important;
  padding: 5rem 2rem 3rem !important;
  text-align: center !important;
  margin-top: auto !important; /* 하단 밀착 */
}

.hybrid-footer-logo {
  font-family: 'Playfair Display', serif !important;
  font-size: 2rem !important;
  font-weight: 700 !important;
  margin-bottom: 1rem !important;
  color: var(--brand-mint) !important;
}

.hybrid-footer-text {
  font-size: 0.95rem !important;
  color: rgba(247, 250, 249, 0.6) !important;
  margin-bottom: 3rem !important;
  line-height: 1.8 !important;
}

.hybrid-footer-links {
  display: flex !important;
  justify-content: center !important;
  gap: 2rem !important;
  border-top: 1px solid rgba(247, 250, 249, 0.1) !important;
  padding-top: 2rem !important;
}

.hybrid-footer-links a {
  color: rgba(247, 250, 249, 0.5) !important;
  text-decoration: none !important;
  font-size: 0.85rem !important;
  transition: color 0.3s ease !important;
}

.hybrid-footer-links a:hover {
  color: var(--brand-mint) !important;
}

/* ==================== 4. 기존 워드프레스 껍데기 박탈 (제거) ==================== */
header.site-header, footer.site-footer, 
.site-header-wrapper, .site-footer-wrapper, 
.wp-block-template-part, .wp-site-blocks > header, .wp-site-blocks > footer {
  display: none !important; /* 워드프레스 기본 헤더/푸터 완전 삭제 */
}

/* 고정된 헤더 높이만큼 본문 패딩 추가 (기존 40px -> 120px) */
body {
  padding-top: 120px !important;
}

/* 모바일 대응 (반응형 메뉴숨김 및 정렬) */
@media (max-width: 768px) {
  .hybrid-nav { display: none !important; } /* 심플함을 위해 모바일에선 햄버거 생략 및 로고/CTA만 노출 */
  .hybrid-header-container { padding: 0 1.5rem !important; }
}
</style>

<!-- ==================== [하드코딩 헤더 HTML] ==================== -->
<header id="hybrid-master-header" class="hybrid-master-header">
  <div class="hybrid-header-container">
    <!-- 로고 -->
    <div class="hybrid-logo">
      <a href="https://sociallogiclab.org">Danhae</a>
    </div>
    
    <!-- 하드코딩된 메인 메뉴 -->
    <nav class="hybrid-nav">
      <ul>
        <li><a href="https://sociallogiclab.org/">Home</a></li>
        <li><a href="https://sociallogiclab.org/philosophy">Philosophy</a></li>
        <li><a href="https://insights.sociallogiclab.org/">Insights</a></li>
        <li><a href="https://sociallogiclab.org/programs">Programs</a></li>
      </ul>
    </nav>
    
    <!-- CTA 버튼 -->
    <div class="hybrid-cta">
      <a href="https://sociallogiclab.org/contact" class="hybrid-btn">Connect</a>
    </div>
  </div>
</header>

<!-- 
========================================================
이 중간 영역에 워드프레스의 콘텐츠(알맹이)가 출력됩니다.
======================================================== 
-->

<!-- ==================== [하드코딩 푸터 HTML] ==================== -->
<footer id="hybrid-master-footer" class="hybrid-master-footer">
  <div class="hybrid-footer-container">
    <div class="hybrid-footer-logo">Danhae</div>
    <p class="hybrid-footer-text">
      Architecting Stillness.<br>
      Copyright &copy; 2026 Social Logic Lab. All rights reserved.
    </p>
    <div class="hybrid-footer-links">
      <a href="https://sociallogiclab.org/privacy">Privacy Policy</a>
      <a href="https://sociallogiclab.org/terms">Terms of Service</a>
    </div>
  </div>
</footer>
